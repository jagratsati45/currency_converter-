<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter — Live Exchange Rates</title>
    <meta
      name="description"
      content="Convert currencies instantly with live exchange rates. Supports 150+ world currencies with real-time data."
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Floating animated gradient orbs for background effect -->
    <div class="bg-orbs" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <main class="app" id="app">
      <header class="app-header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fa-solid fa-coins"></i>
          </div>
          <div class="logo-text">
            <h1>Currency Converter</h1>
            <p class="tagline">Real-time exchange rates</p>
          </div>
        </div>
      </header>

      <!-- Main converter card with glassmorphism styling -->
      <section class="card" id="converter-card">
        <form id="converter-form" autocomplete="off">
          <!-- Amount input with icon -->
          <div class="input-group" id="amount-group">
            <label for="amount-input" class="input-label">Amount</label>
            <div class="input-wrapper">
              <input
                id="amount-input"
                value="1"
                type="number"
                min="0"
                step="any"
                placeholder="Enter amount..."
              />
              <span class="input-icon">
                <i class="fa-solid fa-money-bill-wave"></i>
              </span>
            </div>
          </div>

          <!-- Currency selection row: From, Swap, To -->
          <div class="currency-row" id="currency-row">
            <div class="currency-picker" id="from-picker">
              <label class="input-label">From</label>
              <div class="picker-box">
                <img
                  class="flag-img"
                  src="https://flagsapi.com/US/flat/64.png"
                  alt="From country flag"
                  id="from-flag"
                />
                <select name="from" id="from-select" aria-label="From currency">
                </select>
                <i class="fa-solid fa-chevron-down picker-arrow"></i>
              </div>
            </div>

            <button
              type="button"
              class="swap-btn"
              id="swap-btn"
              aria-label="Swap currencies"
              title="Swap currencies"
            >
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </button>

            <div class="currency-picker" id="to-picker">
              <label class="input-label">To</label>
              <div class="picker-box">
                <img
                  class="flag-img"
                  src="https://flagsapi.com/IN/flat/64.png"
                  alt="To country flag"
                  id="to-flag"
                />
                <select name="to" id="to-select" aria-label="To currency">
                </select>
                <i class="fa-solid fa-chevron-down picker-arrow"></i>
              </div>
            </div>
          </div>

          <!-- Conversion result with shimmer animation -->
          <div class="result-display" id="result-display">
            <div class="result-content">
              <span class="result-text" id="result-text">1 USD = 80 INR</span>
              <div class="result-shimmer"></div>
            </div>
          </div>

          <!-- Submit button with loading spinner -->
          <button type="submit" class="convert-btn" id="convert-btn">
            <span class="btn-text">Convert</span>
            <span class="btn-loader" id="btn-loader">
              <i class="fa-solid fa-spinner fa-spin"></i>
            </span>
            <i class="fa-solid fa-arrow-right btn-arrow"></i>
          </button>
        </form>
      </section>

      <footer class="app-footer">
        <p>Powered by live exchange rates &bull; Updated in real-time</p>
      </footer>
    </main>

    <script src="currency.js"></script>
    <script src="script.js"></script>
  </body>
</html>
